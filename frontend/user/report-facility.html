<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FixPoint</title>
  <link rel="stylesheet" href="../style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
</head>
<body>
<header class="header">
  <div class="header-left">
    <button class="hamburger" id="hamburger">
      <span></span><span></span><span></span>
    </button>
    <div class="header-title">FixPoint</div>
  </div>
  <div class="header-right">
    <button class="theme-toggle" id="theme-toggle">
      <span class="material-symbols-outlined">light_mode</span>
    </button>
    <button class="profile-btn">
      <span class="material-symbols-outlined">person</span>
    </button>
  </div>
</header>

<aside class="sidebar" id="sidebar">
  <a href="dashboard.html" class="nav-link"><span class="material-symbols-outlined">home</span>Dashboard</a>
  <a href="report-facility.html" class="nav-link active"><span class="material-symbols-outlined">report</span>Report Issue</a>
  <a href="activity.html" class="nav-link"><span class="material-symbols-outlined">history</span>My Activity</a>
  <div class="sidebar-bottom">
    <button id="logoutBtn" class="btn btn-secondary"><span class="material-symbols-outlined">logout</span>Logout</button>
  </div>
</aside>
<main class="main" id="main">
  <h1 class="page-title">Report Issue</h1>
  <div class="card">
    <form id="reportFacilityForm">
      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" class="form-control" required>
          <option value="IT">IT Support</option>
          <option value="Facility">Facility Maintenance</option>
        </select>
      </div>
      <div class="form-group">
        <label for="location">Location</label>
        <input type="text" id="location" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" class="form-control" rows="4" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Submit Report</button>
    </form>
  </div>
</main>

  <script src="../js/shared.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
