<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FixPoint</title>
  <link rel="stylesheet" href="../style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
</head>
<body>
<header class="header">
  <div class="header-left">
    <button class="hamburger" id="hamburger">
      <span></span><span></span><span></span>
    </button>
    <div class="header-title">FixPoint</div>
  </div>
  <div class="header-right">
    <button class="theme-toggle" id="theme-toggle">
      <span class="material-symbols-outlined">light_mode</span>
    </button>
    <button class="profile-btn">
      <span class="material-symbols-outlined">person</span>
    </button>
    <button class="logout-btn header-icon-btn" id="logoutBtnTop">
      <span class="material-symbols-outlined">logout</span>
    </button>
  </div>
</header>

<aside class="sidebar" id="sidebar">
  <a href="dashboard.html" class="nav-link"><span class="material-symbols-outlined">dashboard</span>Dashboard</a>
  <a href="tickets.html" class="nav-link active"><span class="material-symbols-outlined">confirmation_number</span>Tickets</a>

</aside>
<main class="main" id="main">
  <div class="table-toolbar">
    <div>
      <h1 class="page-title" style="margin-bottom: 0;">Facility Tickets</h1>
      <p class="page-subtitle" style="margin-bottom: 0;">Manage and resolve facility maintenance reports</p>
    </div>
    <div class="toolbar-filters">
              <div class="search-input-wrap">
          <span class="material-symbols-outlined">search</span>
          <input type="text" id="searchInput" class="search-input" placeholder="Search tickets..." />
        </div>
<select id="statusFilter" class="filter-select">
        <option value="all">All Statuses</option>
        <option value="pending">Pending</option>
        <option value="progress">In Progress</option>
        <option value="resolved">Resolved</option>
        <option value="rejected">Rejected</option>
      </select>
      <select id="dateSort" class="filter-select">
        <option value="desc">Newest First</option>
        <option value="asc">Oldest First</option>
      </select>
    </div>
  </div>
  <div class="card table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Category</th>
          <th>Location</th>
          <th>Status</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="ticketsContainer">
      </tbody>
    </table>
  </div>
</main>

  <div id="ticketDetailModal" class="modal-overlay">
  <div class="ticket-modal-card">
    <div class="ticket-modal-header">
      <div>
        <span id="modalTicketId" class="ticket-id">#FP-000000</span>
        <div id="modalTicketTitle" class="ticket-modal-title">Ticket Title</div>
      </div>
      <button id="closeModalBtn" class="theme-toggle" type="button">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="ticket-modal-meta">
      <div>
        <div class="meta-item-label">Category</div>
        <div id="modalTicketCategory" class="meta-item-value">N/A</div>
      </div>
      <div>
        <div class="meta-item-label">Location</div>
        <div id="modalTicketLocation" class="meta-item-value">N/A</div>
      </div>
      <div>
        <div class="meta-item-label">Status</div>
        <div id="modalTicketStatus" class="meta-item-value">Pending</div>
      </div>
      <div>
        <div class="meta-item-label">Date Submitted</div>
        <div id="modalTicketDate" class="meta-item-value">N/A</div>
      </div>
    </div>
    <div>
      <div class="meta-item-label" style="margin-bottom: 0.375rem;">Description</div>
      <div id="modalTicketDesc" class="ticket-modal-desc-box">No description provided.</div>
    </div>
  </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>

  <script src="../js/shared.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
