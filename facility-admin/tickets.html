<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FixPoint</title>
  <link rel="stylesheet" href="../style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
</head>
<body>
<header class="header">
  <div class="header-left">
    <button class="hamburger" id="hamburger">
      <span></span><span></span><span></span>
    </button>
    <div class="header-title">FixPoint</div>
  </div>
  <div class="header-right">
    <button class="theme-toggle" id="theme-toggle">
      <span class="material-symbols-outlined">light_mode</span>
    </button>
    <button class="profile-btn">
      <span class="material-symbols-outlined">person</span>
    </button>
    <button class="logout-btn header-icon-btn" id="logoutBtnTop">
      <span class="material-symbols-outlined">logout</span>
    </button>
  </div>
</header>

<aside class="sidebar" id="sidebar">
  <a href="dashboard.html" class="nav-link"><span class="material-symbols-outlined">dashboard</span>Dashboard</a>
  <a href="tickets.html" class="nav-link active"><span class="material-symbols-outlined">confirmation_number</span>Tickets</a>

</aside>
<main class="main" id="main">
  <h1 class="page-title">Facility Tickets</h1>
  <div class="card table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Category</th>
          <th>Status</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="ticketsContainer">
      </tbody>
    </table>
  </div>
</main>

  <script src="../js/shared.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
