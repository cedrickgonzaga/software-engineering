<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FixPoint</title>
  <link rel="stylesheet" href="../style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
</head>
<body>
<header class="header">
  <div class="header-left">
    <button class="hamburger" id="hamburger">
      <span></span><span></span><span></span>
    </button>
    <div class="header-title">FixPoint</div>
  </div>
  <div class="header-right">
    <button class="theme-toggle" id="theme-toggle">
      <span class="material-symbols-outlined">light_mode</span>
    </button>
    <button class="profile-btn">
      <span class="material-symbols-outlined">person</span>
    </button>
    <button class="logout-btn header-icon-btn" id="logoutBtnTop">
      <span class="material-symbols-outlined">logout</span>
    </button>
  </div>
</header>

<aside class="sidebar" id="sidebar">
  <a href="dashboard.html" class="nav-link active"><span class="material-symbols-outlined">home</span>Dashboard</a>
  <a href="report-facility.html" class="nav-link"><span class="material-symbols-outlined">report</span>Report Issue</a>
  <a href="activity.html" class="nav-link"><span class="material-symbols-outlined">history</span>My Activity</a>

</aside>
<main class="main" id="main">
  <h1 class="page-title">Dashboard</h1>
  <p class="page-subtitle">Welcome to FixPoint</p>
  <div class="grid-2">
    <a href="report-facility.html" class="choice-card">
      <div class="choice-icon"><span class="material-symbols-outlined">report</span></div>
      <div class="choice-title">Report Issue</div>
      <div class="choice-desc">Report a facility or IT issue</div>
    </a>
    <a href="activity.html" class="choice-card">
      <div class="choice-icon"><span class="material-symbols-outlined">history</span></div>
      <div class="choice-title">My Activity</div>
      <div class="choice-desc">View your submitted reports</div>
    </a>
  </div>
</main>

  <script src="../js/shared.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
